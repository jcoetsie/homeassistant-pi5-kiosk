---
# Kiosk role - Browser and X session configuration
- name: Create kiosk wrapper script for retry logic
  ansible.builtin.copy:
    dest: "/home/{{ kiosk_user }}/kiosk.sh"
    owner: "{{ kiosk_user }}"
    group: "{{ kiosk_user }}"
    mode: "0755"
    content: |
      #!/bin/bash
      # Log file for debugging
      LOG_FILE="/home/{{ kiosk_user }}/kiosk.log"
      exec > >(tee -a "$LOG_FILE") 2>&1
      echo "$(date): Kiosk script started"

      # Kill gnome-keyring immediately to prevent any password prompts
      echo "$(date): Killing gnome-keyring..."
      pkill -9 -f gnome-keyring-daemon 2>/dev/null || true

      # Set DISPLAY environment variable
      export DISPLAY=:0

      # Kill any existing chromium instances
      echo "$(date): Killing existing chromium instances..."
      killall chromium-browser 2>/dev/null || true
      killall chromium 2>/dev/null || true
      sleep 2

      # Remove chromium's SingletonLock to prevent "already running" issues
      echo "$(date): Cleaning up chromium lock files..."
      rm -rf /home/{{ kiosk_user }}/.config/chromium/SingletonLock
      rm -rf /home/{{ kiosk_user }}/.config/chromium/SingletonCookie
      rm -rf /home/{{ kiosk_user }}/.config/chromium/SingletonSocket
      rm -rf /home/{{ kiosk_user }}/.config/chromium-kiosk/SingletonLock
      rm -rf /home/{{ kiosk_user }}/.config/chromium-kiosk/SingletonCookie
      rm -rf /home/{{ kiosk_user }}/.config/chromium-kiosk/SingletonSocket

      # Wait for network to be up
      echo "$(date): Checking network connectivity..."
      until ping -c 1 {{ home_assistant_ip }} &>/dev/null; do
        echo "$(date): Waiting for network..."
        sleep 2
      done
      echo "$(date): Network is up!"

      # Launch Chromium with monitor HTML immediately
      # The monitor page will show connection status and retry automatically
      echo "$(date): Launching chromium in kiosk mode..."
      {{ kiosk_browser }} \
        --kiosk \
        --noerrdialogs \
        --disable-infobars \
        --no-first-run \
        --no-default-browser-check \
        --disable-sync \
        --disable-translate \
        --disable-features=Translate,TranslateUI \
        --disable-component-update \
        --overscroll-history-navigation=0 \
        --disable-breakpad \
        --disable-session-crashed-bubble \
        --disable-restore-session-state \
        --check-for-update-interval=31536000 \
        --password-store=basic \
        --use-mock-keychain \
        --enable-features=TouchTextEditingRedesign \
        --force-tablet-mode=touch \
        --touch-events=enabled \
        --enable-pinch \
        --enable-smooth-scrolling \
        --user-data-dir=/home/{{ kiosk_user }}/.config/chromium-kiosk \
        --app=file:///home/{{ kiosk_user }}/ha-monitor.html >> "$LOG_FILE" 2>&1

- name: Configure X session for kiosk mode
  ansible.builtin.copy:
    dest: "/home/{{ kiosk_user }}/.xinitrc"
    owner: "{{ kiosk_user }}"
    group: "{{ kiosk_user }}"
    mode: "0755"
    content: |
      #!/bin/sh
      # Set DISPLAY
      export DISPLAY=:0

      # Kill gnome-keyring to prevent password prompts
      pkill -9 -f gnome-keyring-daemon 2>/dev/null || true

      # Set keyboard layout
      setxkbmap {{ keyboard_layout }}

      # Configure screen blanking after 10 minutes of inactivity
      xset s 600 600        # Screensaver timeout: 10 minutes
      xset dpms 0 0 600     # DPMS: standby off, suspend off, off after 10 min

      # Hide mouse cursor
      unclutter -idle 0.1 -root &

      # Start window manager
      matchbox-window-manager -use_titlebar no &

      # Wait a bit for X to stabilize
      sleep 2

      # Start floating keyboard button in background
      /home/{{ kiosk_user }}/keyboard-button.sh &

      # Start Home Assistant availability monitor in background
      /home/{{ kiosk_user }}/ha-monitor.sh &

      # Start kiosk script
      /home/{{ kiosk_user }}/kiosk.sh

- name: Create .xsession symlink to .xinitrc
  ansible.builtin.file:
    src: "/home/{{ kiosk_user }}/.xinitrc"
    dest: "/home/{{ kiosk_user }}/.xsession"
    owner: "{{ kiosk_user }}"
    group: "{{ kiosk_user }}"
    state: link

- name: Disable gnome-keyring autostart to prevent password prompts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/xdg/autostart/gnome-keyring-pkcs11.desktop
    - /etc/xdg/autostart/gnome-keyring-secrets.desktop
    - /etc/xdg/autostart/gnome-keyring-ssh.desktop
  notify: Restart lightdm

- name: Disable gnome-keyring in lightdm PAM configuration
  ansible.builtin.lineinfile:
    path: /etc/pam.d/lightdm
    regexp: "{{ item }}"
    state: absent
  loop:
    - "pam_gnome_keyring"
  notify: Restart lightdm

- name: Create Home Assistant availability monitor script
  ansible.builtin.copy:
    dest: "/home/{{ kiosk_user }}/ha-monitor.sh"
    owner: "{{ kiosk_user }}"
    group: "{{ kiosk_user }}"
    mode: "0755"
    content: |
      #!/bin/bash
      # Home Assistant availability monitor
      # Switches between HA and error page based on availability

      HA_URL="{{ kiosk_url }}"
      HA_HOST="{{ home_assistant_ip }}"
      ERROR_PAGE="file:///home/{{ kiosk_user }}/ha-error.html"
      CHECK_INTERVAL=10
      CURRENT_STATE=""

      log() {
          echo "$(date '+%Y-%m-%d %H:%M:%S'): $1" >> /home/{{ kiosk_user }}/ha-monitor.log
      }

      check_ha() {
          # Check if Home Assistant is responding
          if curl --output /dev/null --silent --fail --max-time 3 "$HA_URL"; then
              echo "up"
          else
              echo "down"
          fi
      }

      get_current_url() {
          # Get current URL from Chromium using xdotool
          export DISPLAY=:0
          xdotool search --class "Chromium" getwindowname 2>/dev/null | head -1
      }

      switch_to_error_page() {
          export DISPLAY=:0
          log "Switching to error page - HA is down"
          # Use xdotool to send Ctrl+L (focus address bar) and type new URL
          WID=$(xdotool search --class "Chromium" | head -1)
          if [ -n "$WID" ]; then
              xdotool windowactivate --sync "$WID"
              xdotool key --clearmodifiers ctrl+l
              sleep 0.2
              xdotool type --clearmodifiers "$ERROR_PAGE"
              xdotool key Return
          fi
      }

      switch_to_ha() {
          export DISPLAY=:0
          log "Switching to Home Assistant - HA is up"
          WID=$(xdotool search --class "Chromium" | head -1)
          if [ -n "$WID" ]; then
              xdotool windowactivate --sync "$WID"
              xdotool key --clearmodifiers ctrl+l
              sleep 0.2
              xdotool type --clearmodifiers "$HA_URL"
              xdotool key Return
          fi
      }

      log "HA Monitor started"

      while true; do
          NEW_STATE=$(check_ha)

          if [ "$NEW_STATE" != "$CURRENT_STATE" ]; then
              if [ "$NEW_STATE" = "up" ]; then
                  switch_to_ha
              else
                  switch_to_error_page
              fi
              CURRENT_STATE="$NEW_STATE"
          fi

          sleep "$CHECK_INTERVAL"
      done

- name: Create Home Assistant error page
  ansible.builtin.copy:
    dest: "/home/{{ kiosk_user }}/ha-error.html"
    owner: "{{ kiosk_user }}"
    group: "{{ kiosk_user }}"
    mode: "0644"
    content: |
      <!DOCTYPE html>
      <html lang="en">
      <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Home Assistant Unavailable</title>
          <style>
              body {
                  margin: 0;
                  font-family: Arial, sans-serif;
                  background: #1a1a1a;
                  color: #fff;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  height: 100vh;
              }
              .container {
                  text-align: center;
                  padding: 40px;
              }
              h1 {
                  font-size: 3em;
                  margin-bottom: 20px;
                  color: #ff6b6b;
              }
              .spinner {
                  border: 8px solid #333;
                  border-top: 8px solid #ff6b6b;
                  border-radius: 50%;
                  width: 80px;
                  height: 80px;
                  animation: spin 1s linear infinite;
                  margin: 30px auto;
              }
              @keyframes spin {
                  0% { transform: rotate(0deg); }
                  100% { transform: rotate(360deg); }
              }
              .message {
                  font-size: 1.5em;
                  margin-top: 20px;
              }
              .time {
                  font-size: 1.2em;
                  color: #888;
                  margin-top: 20px;
              }
          </style>
      </head>
      <body>
          <div class="container">
              <h1>⚠️ Connection Lost</h1>
              <div class="spinner"></div>
              <div class="message">Home Assistant is temporarily unavailable</div>
              <div class="time" id="time">Reconnecting...</div>
          </div>
          <script>
              let seconds = 0;
              setInterval(() => {
                  seconds += 10;
                  document.getElementById('time').textContent =
                      `Checking again in ${10 - (seconds % 10)} seconds... (${Math.floor(seconds / 60)}:${(seconds % 60).toString().padStart(2, '0')})`;
              }, 1000);
          </script>
      </body>
      </html>

- name: Create Home Assistant monitor HTML file
  ansible.builtin.copy:
    dest: "/home/{{ kiosk_user }}/ha-monitor.html"
    owner: "{{ kiosk_user }}"
    group: "{{ kiosk_user }}"
    mode: "0644"
    content: |
      <!DOCTYPE html>
      <html lang="en">
      <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Home Assistant Kiosk</title>
          <style>
              body {
                  margin: 0;
                  font-family: Arial, sans-serif;
                  background: #1a1a1a;
                  color: #fff;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  height: 100vh;
              }
              #status {
                  font-size: 2.5em;
                  text-align: center;
                  padding: 40px;
              }
              .spinner {
                  border: 8px solid #333;
                  border-top: 8px solid #fff;
                  border-radius: 50%;
                  width: 60px;
                  height: 60px;
                  animation: spin 1s linear infinite;
                  margin: 20px auto;
              }
              @keyframes spin {
                  0% { transform: rotate(0deg); }
                  100% { transform: rotate(360deg); }
              }
          </style>
      </head>
      <body>
          <div id="status">
              <div class="spinner"></div>
              <div>Connecting to Home Assistant...</div>
          </div>
          <script>
              const haUrl = '{{ kiosk_url }}';
              let checkCount = 0;

              function checkHA() {
                  checkCount++;
                  fetch(haUrl, { method: 'HEAD', mode: 'no-cors' })
                      .then(() => {
                          // Home Assistant is up, redirect to it
                          window.location.href = haUrl;
                      })
                      .catch(() => {
                          // Still checking, update message
                          const statusDiv = document.querySelector('#status div:last-child');
                          statusDiv.textContent = `Waiting for Home Assistant... (${checkCount * 10}s)`;
                      });
              }

              // Check immediately
              checkHA();
              // Then check every 10 seconds
              setInterval(checkHA, 10000);
          </script>
      </body>
      </html>

- name: Configure kiosk systemd service to use monitor HTML
  ansible.builtin.copy:
    dest: /etc/systemd/system/kiosk.service
    mode: "0644"
    content: |
      [Unit]
      Description=Kiosk Display
      After=network.target

      [Service]
      User={{ kiosk_user }}
      ExecStart=/usr/bin/chromium-browser --kiosk --disable-web-security --user-data-dir=/home/{{ kiosk_user }}/.chromium --app=file:///home/{{ kiosk_user }}/ha-monitor.html
      Restart=always

      [Install]
      WantedBy=graphical.target
