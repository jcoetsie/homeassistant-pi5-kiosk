# Packages role - Install all required packages
- name: Install required packages
  ansible.builtin.apt:
    name:
      - chromium-browser
      - xserver-xorg
      - xinit
      - lightdm
      - unclutter
      - matchbox-window-manager
      - matchbox-keyboard
      - x11-xserver-utils
      - xdotool
      - curl
      - yad
      - logrotate
    state: present

- name: Ensure autologin-user is set
  ansible.builtin.lineinfile:
    path: /etc/lightdm/lightdm.conf
    regexp: "^#?autologin-user=.*"
    line: "autologin-user={{ kiosk_user }}"
    state: present
  become: true
  notify: Restart lightdm

- name: Ensure autologin-user-timeout is set
  ansible.builtin.lineinfile:
    path: /etc/lightdm/lightdm.conf
    regexp: "^#?autologin-user-timeout=.*"
    line: "autologin-user-timeout=0"
    state: present
  become: true
  notify: Restart lightdm
