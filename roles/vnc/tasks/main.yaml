---
# VNC role - Configure VNC remote access
- name: Install VNC server
  ansible.builtin.apt:
    name:
      - realvnc-vnc-server
    state: present

- name: Enable VNC server
  ansible.builtin.command: raspi-config nonint do_vnc 0
  changed_when: true

- name: Disable wayvnc to prevent port conflict with RealVNC
  ansible.builtin.systemd:
    name: wayvnc
    state: stopped
    enabled: false
  failed_when: false

- name: Create VNC config directory
  ansible.builtin.file:
    path: /root/.vnc/config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure VNC to share existing X session
  ansible.builtin.copy:
    dest: /root/.vnc/config.d/vncserver-x11
    owner: root
    group: root
    mode: "0644"
    content: |
      Authentication=VncAuth
      Encryption=PreferOn
      AvoidExistingConnections=0
      IdleTimeout=0

- name: Set system-wide VNC password
  ansible.builtin.shell: |
    set -o pipefail
    echo "{{ kiosk_user_password }}" | vncpasswd -service
  args:
    executable: /bin/bash
  become: true
  changed_when: true
  no_log: true

- name: Ensure graphical boot mode
  ansible.builtin.command: raspi-config nonint do_boot_behaviour B4
  changed_when: true

- name: Restart VNC server service
  ansible.builtin.systemd:
    name: vncserver-x11-serviced
    state: restarted
    enabled: true
