---
# RPI Monitor role - Install and configure Raspberry Pi MQTT Monitor
# https://github.com/hjelev/rpi-mqtt-monitor

- name: Install rpi-mqtt-monitor dependencies
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
    state: present
  become: true

- name: Create rpi-monitor directory
  ansible.builtin.file:
    path: /opt/rpi-mqtt-monitor
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Clone rpi-mqtt-monitor repository
  ansible.builtin.git:
    repo: https://github.com/hjelev/rpi-mqtt-monitor.git
    dest: /opt/rpi-mqtt-monitor
    version: master
    force: true
  become: true

- name: Create Python virtualenv for rpi-mqtt-monitor
  ansible.builtin.command:
    cmd: python3 -m venv /opt/rpi-mqtt-monitor/venv
  args:
    creates: /opt/rpi-mqtt-monitor/venv/bin/activate
  become: true

- name: Install Python dependencies into virtualenv
  ansible.builtin.pip:
    requirements: /opt/rpi-mqtt-monitor/requirements.txt
    virtualenv: /opt/rpi-mqtt-monitor/venv
    state: present
  become: true

- name: Create rpi-mqtt-monitor config file
  ansible.builtin.copy:
    dest: /opt/rpi-mqtt-monitor/config.py
    owner: root
    group: root
    mode: "0644"
    content: |
      # Generated config for rpi-mqtt-monitor (deployed by Ansible)
      import os

      version = "0.6.3"

      # MQTT server configuration
      mqtt_host = "{{ mqtt_broker | default('127.0.0.1') }}"
      mqtt_user = "{{ mqtt_user | default('') }}"
      mqtt_password = "{{ mqtt_password | default('') }}"
      mqtt_port = {{ mqtt_port | default(1883) }}
      mqtt_discovery_prefix = "{{ mqtt_discovery_prefix | default('homeassistant') }}"
      mqtt_topic_prefix = "rpi-{{ mqtt_device_id | default('pi') }}"
      mqtt_uns_structure = ""

      # Retain / QOS
      retain = True
      qos = 0

      # Home Assistant API configuration (optional)
      hass_token = ""
      hass_host = ""

      # Messages configuration
      language = "en"

      # Interval in seconds between probes
      service_sleep_time = {{ mqtt_check_interval | default(60) }}

      # Feature flags and defaults
      discovery_messages = True
      restart_button = True
      shutdown_button = True
      update = True
      display_control = False
      os_user = 'root'
      git_update = True
      cpu_load = True
      cpu_temp = True
      cpu_thermal_zone = 0
      used_space = True
      used_space_path = '/'
      voltage = False
      sys_clock_speed = False
      swap = False
      memory = True
      uptime = True
      uptime_seconds = False
      wifi_strength = True
      wifi_ssid = True
      wifi_signal = wifi_strength
      wifi_signal_dbm = False
      network_speed_test = False
      external_drives = []
      ext_sensors = []
      use_availability = False

      # Backwards-compatible / additional options referenced in the script
      apt_updates = False
      drive_temps = False
      expire_after_time = 0
      get_content_outputfile = False
      net_io = False
      output_filename = ''
      output_mode = ''
      output_type = ''
      random_delay = 0
      ha_device_name = "{{ ansible_hostname | default('pi') }}"
      rpi5_fan_speed = False
      rpi_power_status = False
      update_check_interval = 86400
  become: true
  notify: Restart rpi-mqtt-monitor

- name: Create systemd service for rpi-mqtt-monitor
  ansible.builtin.copy:
    dest: /etc/systemd/system/rpi-mqtt-monitor.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Raspberry Pi MQTT Monitor
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User=root
      WorkingDirectory=/opt/rpi-mqtt-monitor
      Environment=PYTHONPATH=/opt/rpi-mqtt-monitor
      ExecStart=/opt/rpi-mqtt-monitor/venv/bin/python /opt/rpi-mqtt-monitor/src/rpi-cpu2mqtt.py
      Restart=on-failure
      RestartSec=30

      [Install]
      WantedBy=multi-user.target
  become: true
  notify: Restart rpi-mqtt-monitor

- name: Enable and start rpi-mqtt-monitor service
  ansible.builtin.systemd:
    name: rpi-mqtt-monitor
    enabled: true
    state: started
    daemon_reload: true
  become: true
