---
- name: Configure Raspberry Pi 5 for Home Assistant Kiosk Display
  hosts: kiosk
  become: true
  gather_facts: true

  vars:
    kiosk_user: kiosk
    kiosk_user_password: "{{ lookup('env', 'KIOSK_PASSWORD') }}"
    kiosk_url: "{{ lookup('env', 'KIOSK_URL') | default('http://192.168.1.5:8123/lovelace/0', true) }}"
    home_assistant_ip: "{{ lookup('env', 'HOME_ASSISTANT_IP') | default('192.168.1.5', true) }}"
    kiosk_browser: chromium-browser
    keyboard_layout: "{{ lookup('env', 'KEYBOARD_LAYOUT') | default('be', true) }}"
    wifi_ssid: "{{ lookup('env', 'WIFI_SSID') | default('YOUR_WIFI_SSID', true) }}"
    wifi_password: "{{ lookup('env', 'WIFI_PASSWORD') | default('YOUR_WIFI_PASSWORD', true) }}"
    wifi_country: "BE"
    github_runner_token: "{{ lookup('env', 'GITHUB_RUNNER_TOKEN') | default('', true) }}"
    github_repo: "{{ lookup('env', 'GITHUB_REPO') | default('', true) }}"
    mqtt_broker: "{{ lookup('env', 'MQTT_BROKER') | default(home_assistant_ip, true) }}"
    mqtt_port: "{{ lookup('env', 'MQTT_PORT') | default(1883, true) }}"
    mqtt_user: "{{ lookup('env', 'MQTT_USER') | default('', true) }}"
    mqtt_password: "{{ lookup('env', 'MQTT_PASSWORD') | default('', true) }}"
    mqtt_topic_prefix: "{{ lookup('env', 'MQTT_TOPIC_PREFIX') | default('homeassistant', true) }}"
    mqtt_device_id: "{{ lookup('env', 'MQTT_DEVICE_ID') | default(inventory_hostname, true) }}"
    mqtt_check_interval: "{{ lookup('env', 'MQTT_CHECK_INTERVAL') | default(60, true) }}"
    enable_rpi_monitor: "{{ lookup('env', 'ENABLE_RPI_MONITOR') | default('false', true) }}"

  roles:
    - role: common
    - role: system
    - role: network
    - role: packages
    - role: vnc
    - role: kiosk
    - role: keyboard
    - role: logs
    - role: rpi_monitor
      when: enable_rpi_monitor | bool
    - role: github_runner
      when: github_runner_token != '' and github_repo != ''
